services:
  caddy:
    image: caddy:latest
    cap_add:
      - NET_ADMIN
    environment:
      - "DOMAIN=raxen001.xyz"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

