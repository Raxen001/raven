services:
  navidrome:
    image: navidrome/navidrome:latest
    user: '1000:1000'
    environment:
      - TZ=Asia/Kolkata
      - ND_MUSICFOLDER=/music/artists/
    volumes:
      - ~/data/navidrome:/data:z
      - "/hdd/Media/music/:/music/:ro"
    ports:
      - "4533:4533"
    restart: unless-stopped
